[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flyconnectome-mri"
version = "0.1.0"
description = "Research prototype: Drosophila-connectome-constrained neural networks for brain MRI classification (not a medical device)."
readme = "README.md"
requires-python = ">=3.10"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
# requirements.txt is the single source of truth for dependencies.
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
