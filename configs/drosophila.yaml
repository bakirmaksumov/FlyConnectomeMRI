# Real Drosophila MaleCNS EB-128 graph, PRIMARY variant w20 (weight >= 20).
# Engineering/provenance validation graph, NOT a visual-system graph.
# Only the graph (and the run name) differ from base.yaml.
inherit: base.yaml

experiment:
  name: drosophila

graph:
  type: drosophila
  num_nodes: 128
  edges_file: data/connectome/drosophila_128_w20.csv
  nodes_file: data/connectome/drosophila_128_w20_nodes.csv
  node_column: bodyId
