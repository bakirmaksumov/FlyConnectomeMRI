# Watts-Strogatz (directed variant) control matched to EB-128 w20, control seed 0.
# Only the graph (and the run name) differ from base.yaml.
inherit: base.yaml

experiment:
  name: ws

graph:
  type: ws
  num_nodes: 128
  edges_file: data/connectome/ws_128_w20_seed0.csv
  nodes_file: data/connectome/ws_128_w20_seed0_nodes.csv
  node_column: node_id
