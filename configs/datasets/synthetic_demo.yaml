# SYNTHETIC demo dataset - NOT medical data. Exercises the pipeline only.
# Create the images first:
#   python scripts/make_synthetic_dataset.py --output data/raw/synthetic_demo
# Then:
#   python scripts/prepare_dataset.py --config configs/datasets/synthetic_demo.yaml

name: synthetic_demo
source: "generated by flyconnectome_mri.datasets.synthetic (seed 0); not medical images"
license: "n/a (synthetic, generated locally)"
root: data/raw/synthetic_demo

classes:            # folder name -> label index
  normal: 0
  tumor: 1
positive_class: tumor

# File names look like P0001_s00.png: the patient is the part before "_s".
patient_id_source: filename_regex
patient_id_regex: '^(?P<patient>P\d+)_s\d+'

split_seed: 0
train_fraction: 0.7
val_fraction: 0.15
test_fraction: 0.15

on_invalid_image: error
image_size: 64
grayscale: true
output_dir: data/splits/synthetic_demo
