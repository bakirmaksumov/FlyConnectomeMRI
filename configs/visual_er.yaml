# Erdos-Renyi control matched to the VISUAL graph; control graph seed = training seed.
# Phase 9. Only the graph (and the run name) differ from base.yaml.
inherit: base.yaml

experiment:
  name: visual_er

graph:
  type: er
  label: visual
  num_nodes: 128
  edges_file: data/connectome/er_visual128_raw_seed{seed}.csv
  nodes_file: data/connectome/er_visual128_raw_seed{seed}_nodes.csv
  node_column: node_id
