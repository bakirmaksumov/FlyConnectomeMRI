# Erdos-Renyi control matched to EB-128 w20 (same nodes and edges), control graph seed = training seed ({seed} is filled in).
# Only the graph (and the run name) differ from base.yaml.
inherit: base.yaml

experiment:
  name: er

graph:
  type: er
  num_nodes: 128
  edges_file: data/connectome/er_128_w20_seed{seed}.csv
  nodes_file: data/connectome/er_128_w20_seed{seed}_nodes.csv
  node_column: node_id
