# Barabasi-Albert (directed variant) control matched to EB-128 w20, control graph seed = training seed ({seed} is filled in).
# Only the graph (and the run name) differ from base.yaml.
inherit: base.yaml

experiment:
  name: ba

graph:
  type: ba
  num_nodes: 128
  edges_file: data/connectome/ba_128_w20_seed{seed}.csv
  nodes_file: data/connectome/ba_128_w20_seed{seed}_nodes.csv
  node_column: node_id
